<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="52%" stop-color="#2562eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="sheen" x1="6" y1="4" x2="36" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="wave" x1="16" y1="31" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="gold" x1="42" y1="8" x2="57" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <clipPath id="drum-clip">
      <circle cx="30.5" cy="34.5" r="15.8" />
    </clipPath>
  </defs>

  <!-- Squircle background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sheen)" />
  <rect
    x="2.75"
    y="2.75"
    width="58.5"
    height="58.5"
    rx="15.25"
    stroke="rgba(255,255,255,0.28)"
    stroke-width="1.5"
  />

  <!-- Washing machine porthole interior -->
  <circle cx="30.5" cy="34.5" r="18" fill="rgba(15,35,66,0.24)" />

  <!-- Swirling water layers & bubbles clipped inside drum -->
  <g clip-path="url(#drum-clip)">
    <path
      d="M 12 37 C 19 31, 27 42, 34 35.5 C 40 30, 45 36.5, 49 34 L 49 54 L 12 54 Z"
      fill="url(#wave)"
    />
    <path
      d="M 12 41.5 C 18.5 37, 26.5 45.5, 34.5 40 C 40.5 36, 45 40, 49 38.5 L 49 54 L 12 54 Z"
      fill="#ffffff"
      opacity="0.94"
    />
    <circle cx="24.5" cy="26.5" r="2.1" fill="#ffffff" opacity="0.88" />
    <circle cx="32.5" cy="24" r="1.4" fill="#bae6fd" opacity="0.92" />
  </g>

  <!-- Crisp white drum rim -->
  <circle cx="30.5" cy="34.5" r="18" stroke="#ffffff" stroke-width="4.2" />

  <!-- Secondary balance sparkle at bottom-left -->
  <path
    d="M 12 47.5 Q 12.6 50.4 15.5 51 Q 12.6 51.6 12 54.5 Q 11.4 51.6 8.5 51 Q 11.4 50.4 12 47.5 Z"
    fill="#bae6fd"
    opacity="0.9"
  />

  <!-- Golden 4-point cleanliness sparkle breaking drum edge -->
  <path
    d="M 49.5 6.5 Q 50.8 14.7 59 16 Q 50.8 17.3 49.5 25.5 Q 48.2 17.3 40 16 Q 48.2 14.7 49.5 6.5 Z"
    fill="url(#gold)"
    stroke="#1d4ed8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
</svg>
